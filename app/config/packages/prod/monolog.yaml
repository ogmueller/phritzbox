monolog:
    handlers:
        main:
            type: fingers_crossed
            action_level: error
            handler: nested
            excluded_http_codes: [404, 405]
            buffer_size: 50 # How many messages should be saved? Prevent memory leaks
        nested:
            # rotating_file, not stream: the log lives in a persisted volume, so
            # a single unbounded file grows until the disk does. Monolog names
            # them prod-YYYY-MM-DD.log and deletes beyond max_files itself; the
            # cron:data:prune command sweeps anything left behind (including the
            # old undated prod.log from before this change).
            type: rotating_file
            path: "%kernel.logs_dir%/%kernel.environment%.log"
            max_files: 14
            level: debug
            formatter: monolog.formatter.json
        console:
            type: console
            process_psr_3_messages: false
            channels: ["!event", "!doctrine"]
