parameters:
    # Fallback used when REFRESH_TOKEN_TTL is not set in the environment (30 days).
    env(REFRESH_TOKEN_TTL): '2592000'

    # Where cron:data:backup writes, and how many compressed snapshots it keeps.
    # The default lives inside the persisted data volume, which protects against
    # corruption and bad migrations but NOT against losing the volume — point it
    # at a bind mount to get off-host copies.
    env(APP_BACKUP_DIR): '%kernel.project_dir%/../data/backups'
    env(APP_BACKUP_KEEP): '3'

    # Retention per tier, in days. 0 means "keep forever" — nothing is ever
    # deleted unless an operator opts in.
    env(APP_RETENTION_RAW_DAYS): '0'
    env(APP_RETENTION_QUARTER_DAYS): '0'
    env(APP_RETENTION_DAILY_DAYS): '0'
    # Per-metric overrides of the raw window, e.g. "voltage=14,power=90".
    env(APP_RETENTION_RAW_OVERRIDES): ''
    env(APP_RETENTION_ALERT_EVENT_DAYS): '0'
    env(APP_RETENTION_LOG_DAYS): '14'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
