name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge
    runs-on: ubuntu-latest
    # pull_request_target exposes secrets to the job, so restrict it to
    # Dependabot's own branches in this repository. Never add a checkout of the
    # pull request's code to this workflow: it runs in the base repository's
    # context and would hand AUTOMERGE_TOKEN to whoever opened the PR.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2

      # Majors are left for manual review; everything else merges once the
      # required checks on main go green.
      - name: Enable auto-merge for non-major updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # GitHub does not start workflows for pushes made with GITHUB_TOKEN,
          # so merging with it leaves main without a CI or Docker run. A PAT
          # attributes the merge to a real user and those runs happen. Falls
          # back to GITHUB_TOKEN so auto-merge still works if the secret is
          # missing or has expired -- main just goes unbuilt again.
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
